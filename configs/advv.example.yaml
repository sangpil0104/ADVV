# ADVV MVP 설정 예시. advv prepare가 로컬 모델 경로를 채운 advv.local.yaml을 만든다.
# YAML 상대 경로는 이 파일 위치 기준. 필수 null은 실행 시 채운다.
schema_version: "1.1"
project: ADVV

run:
  seed: 42
  output_root: ../runs
  strategy: random_until_quota
  target_count: null                  # 필수: 전체 입력에서 새 이미지 총 N장
  quota_scope: total
  limit_policy: until_target_or_user_stop
  max_attempts: null                   # 사용자 확정: 총 시도 제한 없음
  max_wall_time_seconds: null          # 사용자 확정: 총 시간 제한 없음
  source_schedule: round_robin
  chain_augmentation: false

dataset:
  mode: dataset_building
  root: ../data
  input_dir: null                      # 실행 시 사용자 폴더; manifest와 택일
  manifest: ../examples/source_manifest.jsonl
  task: image_only
  eligible_splits: [source, train]
  enforce_group_disjoint: true
  enforce_cross_split_hash_disjoint: true

source_profile:
  mode: auto_with_optional_hint
  prompt_path: ../prompts/source_profile_v2.txt
  response_schema: ../schemas/source_profile.schema.json
  freeze_before_generation: true
  uncertain_action: hold_source
  max_new_tokens: 512

sampler:
  version: random_geometry_v1          # 기본값. 객체 중심은 object_region_v2 (docs/REGION_SAMPLER.md)
  mask_shapes: [ellipse, rectangle]    # v1 전용
  region_area_fraction: [0.05, 0.40]    # v1 전용, 미검증 초기값; 영역 면적 / 이미지 면적
  operations: [relocation, deformation, rotation]
  operation_distribution: uniform
  displacement_diagonal_fraction: [0.02, 0.20]
  rotation_degrees: [-30.0, 30.0]
  # 공식 deformation은 별도 scale 인자가 없으며 위 displacement 범위를 사용한다.
  replay_plan: null                    # 선택: 저장한 계획의 디버깅·재현용
  object_region:                       # object_region_v2 전용; v1에서는 검증만 하고 쓰지 않음
    granularity:
      relocation: [entity]
      rotation: [part]
      deformation: [part, entity]
    rotation_anchor: part_entity_contact  # part 팽창 영역 ∩ (entity − part)의 centroid
    contact_dilation_px: 3
    on_no_region: hold_source          # 기하 영역 fallback 없음 → source_no_region 보류
    max_consecutive_sampling_skips: 8  # 한 원본의 연속 sampling_skipped가 이 수에 닿으면 source_no_region 보류
    rotation_max_error_degrees: 3.0    # upstream이 grid에서 실행할 회전각과 요청각의 허용 오차는
    rotation_max_error_fraction: 0.30  # max(이 각도, 이 비율 × |요청각|). 밖이면 그 각도를 다시 뽑음(미검증)
    rotation_min_executed_degrees: 2.0 # 목표 칸은 실효각이 요청각과 같은 부호이고 |실효각| ≥ 이 값일 때만 인정
                                       # (실효 0°·반대 방향 회전 차단). 요청각 하한 |요청각| ≥ 2°와는 별개 키
  # v2를 쓰려면 source_profile.prompt_path/response_schema도 v4(subjects + subject별 parts)로 바꾼다.
  # text_parts: false이면 v3(subjects만 사용)도 된다.

execution:
  mode: shared_gpus_sequential
  selected_gpu_ids: null               # 필수: 사용자가 실행 시 선택
  generator_python: null
  verifier_python: null
  proposal_python: null                # object_region_v2 전용: SAM 3 proposal worker (../.venv-sam3/bin/python)
  candidate_concurrency: 1
  worker_timeout_seconds: 1800         # 개별 작업 timeout 예시; 총 실행 상한 아님
  max_technical_retries: 1
  max_consecutive_technical_failures: 3  # 정상 NO/UNCERTAIN은 해당하지 않는 기술 장애 중단 기준
  retry_oom: false

region_proposal:                       # object_region_v2 전용. 임계값은 모두 미검증 초기값
  backend: sam3                        # 기본. 비교용: grounding_dino_sam2.1
  model_id: facebook/sam3
  model_path: null                     # sam3.pt가 있는 로컬 폴더 (advv prepare --only sam3)
  model_revision: null                 # configs/upstream.lock.json의 HF revision
  repo_path: ../third_party/sam3       # 공식 facebookresearch/sam3 checkout
  code_revision: null                  # 위 checkout의 고정 commit
  min_entity_score: 0.50               # 텍스트 prompt 인스턴스 점수 하한
  min_part_score: 0.80                 # point prompt 예측 IoU 하한
  entity_area_fraction: [0.02, 0.60]   # entity 면적 / 이미지 면적
  part_area_fraction_of_entity: [0.02, 0.70]  # 하한 0.02: 꼬리·팔·미러 같은 작은 부위 유지(미검증)
  dedupe_iou: 0.85
  part_dedupe_containment: 0.95        # 작은 part가 큰 part 안에 든 비율이 이 값 이상이고
  part_dedupe_area_ratio: 0.80         # 면적비(작은/큰)도 이 값 이상이면 같은 부위로 보고 하나만 남김(미검증)
  part_points_per_entity: 16
  text_parts: true                     # profile v4 parts(subject별 부위 이름) 텍스트 prompt를 점 prompt와 병행
  text_part_forms: [subject_part, part]  # "<subject> <part>"와 "<part>" 단독. 하나만 써도 된다
  min_text_part_score: 0.50            # 텍스트 part 인스턴스 점수 하한(SAM 3 기본 0.5, 미검증)
  text_part_containment: 0.85          # 텍스트 part가 entity mask 안에 들어간 비율 하한
  suppress_point_parts_with_text: true # entity에 텍스트 part가 하나라도 남으면 그 entity의 점 part는 쓰지 않음
  grounding_dino:                      # backend=grounding_dino_sam2.1일 때만 사용
    box_threshold: 0.35
    text_threshold: 0.25

generator:
  backend: dragflow
  repo_path: ../third_party/DragFlow
  revision: null
  upstream_config: null
  weights_lock: null                   # FLUX/adapter/encoder의 모든 revision
  parameters: {}

verifier:
  backend: qwen_multimodal_local
  model_id: Qwen/Qwen3.5-4B
  model_path: null                     # 다운로드한 로컬 모델 디렉터리
  model_revision: null
  processor_revision: null
  local_files_only: true
  fine_tune: false
  dtype: bfloat16
  batch_size: 1
  enable_thinking: false
  do_sample: false
  max_new_tokens: 256                  # 각 VQA 호출 기준
  physical_prompt_path: ../prompts/physical_plausibility_v1.txt
  semantic_prompt_path: ../prompts/semantic_preservation_v1.txt
  response_schema: ../schemas/vqa_response.schema.json
  check_order: [physical, semantic]
  semantic_only_after_physical_yes: true
  preprocessing:
    policy: pinned_processor_defaults
  quantization: null

decision:
  require_all_yes: [physical, semantic]
  accept_answer: "YES"
  reject_answer: "NO"
  uncertain_answer: "UNCERTAIN"
  retry_semantic_decisions: false       # 탈락한 동일 후보를 재질문하지 않음

storage:
  delete_rejected_images: true         # 독립 시각 검수 실험만 사전에 false 선택
  keep_uncertain_images: true
  keep_error_images: true
  persist_raw_vqa: true
  atomic_writes: true

export:
  format: jsonl
  allowed_status: accepted
  require_valid_labels: false          # MVP image-only
  reject_fake_backend: true
  deduplicate_exact_pixels: true
  deduplicate_against_source: true
  near_duplicate_filter: false

visualization:
  enabled: true
  output_subdir: visualizations        # 각 run 디렉터리 안
  format: png
  layout: source_overlay_and_generated
  save_drag_plan: true
  save_comparison: true
  save_metadata: true
  max_panel_side_px: 1024              # 미리보기만 축소, 종횡비 유지
  area_color: "#2196F3"
  area_alpha: 0.25
  draw_area_outline: true
  start_color: "#E53935"
  start_marker: circle
  end_color: "#43A047"
  end_marker: cross
  arrow_color: "#FFD600"
  show_anchor: true
  anchor_color: "#AB47BC"
  show_coordinates: true
  show_area_stats: true
  show_vqa_results: true
  rejected_comparison_policy: follow_image_retention

human_review:
  enabled: false                       # true: Qwen 통과 후 advv review로 사람이 ←통과/→불합격, export는 사람 통과분만

report:
  terminal_progress: true
  record_stage_times: true
  record_peak_vram: true
