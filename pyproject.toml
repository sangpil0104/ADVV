[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advv"
version = "0.1.0"
description = "Augmentation using DragFlow with VQA Verification"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "Pillow>=10", "PyYAML>=6", "jsonschema>=4.18", "tqdm>=4.66"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
download = ["huggingface-hub>=0.34"]

[project.scripts]
advv = "advv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs local model weights and explicitly selected GPUs"]

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["third_party", "runs", "models", ".venv*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
